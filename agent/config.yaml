marketplace:
  mode: gigsim            # gigsim | upwork
  max_requests_per_minute: 20

models:
  profile: open           # open | paid
  profiles:
    open:
      provider: groq
      tiers:
        small: openai/gpt-oss-20b
        strong: openai/gpt-oss-120b
        alt: qwen/qwen3.8-27b       # second open config for the comparison
      fallback_small: openai/gpt-oss-20b
    paid:
      provider: openai
      tiers:
        small: configure-later
        strong: configure-later
  nodes:                  # node -> tier
    scout: small
    analyst: small
    risk_assessor: small
    fit_matcher: small
    pricing: small
    writer: strong
    verifier: small
    critic: strong
    compliance: small
    client_liaison: strong
  embeddings: BAAI/bge-small-en-v1.5      # runs on CPU via fastembed
  reranker: not-used-yet                  # V3 reranker not built

budgets:
  max_graph_steps: 30
  max_revisions: 2
  max_tokens_per_job: 40000   # set from measured p95 after the next measure.py run
  weekly_connects_default: 100

thresholds:
  minimum_fit_score: 0.60
  maximum_risk_score: 0.70
  strong_evidence_score: 0.65
  partial_evidence_score: 0.55

policy:
  min_proposal_words: 20
  max_proposal_words: 300
  max_connects_per_bid: 10   # starting guess, tune later
  banned_phrases: ["guarantee", "100% success", "whatsapp", "telegram", "paypal"]

memory:
  style_min_jobs: 3     # promotion rule: same edit pattern seen in this many different jobs
  outcome_min_n: 5      # promotion rule: this many outcomes in a category

pricing:                # USD per 1M tokens. From memory: VERIFY on groq.com/pricing before reporting
  openai/gpt-oss-20b: {in: 0.075, out: 0.30}
  openai/gpt-oss-120b: {in: 0.15, out: 0.60}
  qwen/qwen3.8-27b: {in: null, out: null}