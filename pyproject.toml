[project]
name = "gigbid-student-project"
version = "0.1.0"
description = "Student scaffold for the AI-4016 GigBid assignment"
requires-python = ">=3.11"
dependencies = [
  "fastapi",
  "uvicorn[standard]",
  "pydantic",
  "pyyaml",
  "langgraph",
  "langchain",
  "langchain-mcp-adapters",
  "mcp",
  "httpx",
  "python-dotenv",
  "langgraph-checkpoint-postgres",
  "psycopg[binary]",
  "psycopg-pool",
  "langchain-groq",
  "fastembed",
  "rank-bm25",
  "sse-starlette",
  "cryptography",
  "numpy",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio", "pytest-cov", "ruff", "mypy"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["agent*", "rag*", "mcp_servers*", "apps*", "evals*", "worker*", "gigsim_local*"]
namespaces = true

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"